kind = "web"
previewPath = "/"
title = "Orderflow Trading Terminal"
description = "A live Binance USDT-M Futures orderflow terminal with synchronized multi-chart pressure analysis, market screening, liquidity studies, and public real-time derivatives data."
version = "1.0.0"
id = "artifacts/orderflow-terminal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24981

[services.development]
run = "pnpm --filter @workspace/orderflow-terminal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orderflow-terminal", "run", "build" ]
serve = "static"
publicDir = "artifacts/orderflow-terminal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24981"
BASE_PATH = "/"
